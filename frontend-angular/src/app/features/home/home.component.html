<div class="home-container">
  <!-- MAIN HERO SECTION ONLY -->
  <header class="hero-section">
    <div class="hero-brand">
      <span class="jp-subtitle">オタクツリー // PERSONAL ARCHIVE</span>
      <h1 class="hero-title">OTAKUTORY</h1>
    </div>

    <p class="hero-tagline">Track everything you love.</p>
    <p class="hero-description">
      A minimalist, self-managed ecosystem to organize, rate, and generate stunning showcases of
      your favorite anime, manga, games, and music. Zero social noise. Just your personal library,
      beautifully cataloged.
    </p>

    <div class="hero-actions">
      <button mat-flat-button class="btn-primary btn-large" (click)="startCollecting()">
        <mat-icon>add_circle_outline</mat-icon>
        START COLLECTING
      </button>
    </div>
  </header>
</div>
