<div class="dashboard-home">
  <section class="hero">
    <span class="jp-subtitle"> ダッシュボード // PERSONAL ARCHIVE </span>

    <h1>
      Welcome back,
      <span>{{ user?.username }}</span>
    </h1>

    <p>Continue building your collection and discover your favourites.</p>
  </section>

  <section class="section">
    <h2>Collection</h2>

    <div class="collection-list">
      <button class="collection-item">
        <div>
          <h3>Anime</h3>

          <small>Completed, Watching, Plan to Watch</small>
        </div>

        <span>247</span>
      </button>

      <button class="collection-item">
        <div>
          <h3>Manga</h3>

          <small>Reading and Completed</small>
        </div>

        <span>61</span>
      </button>

      <button class="collection-item">
        <div>
          <h3>Games</h3>

          <small>Finished and Backlog</small>
        </div>

        <span>23</span>
      </button>

      <button class="collection-item">
        <div>
          <h3>Music</h3>

          <small>Albums and Artists</small>
        </div>

        <span>181</span>
      </button>
    </div>
  </section>

  <section class="section">
    <h2>Continue</h2>

    <div class="featured-card">
      <small>Watching</small>

      <h3>Frieren: Beyond Journey's End</h3>

      <p>Episode 17</p>

      <button mat-flat-button>Continue</button>
    </div>
  </section>

  <section class="section">
    <h2>Generate</h2>

    <div class="generate-grid">
      <div class="generate-card">
        <h3>Top 5</h3>

        <p>Generate a shareable image.</p>
      </div>

      <div class="generate-card">
        <h3>Top 10</h3>

        <p>Generate a complete ranking.</p>
      </div>
    </div>
  </section>
</div>
