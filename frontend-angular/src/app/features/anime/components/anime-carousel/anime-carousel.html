<div
  class="carousel"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onMouseEnter()"
  (focusout)="onMouseLeave()"
>
  <div class="viewport-wrapper">
    <div class="viewport" #viewport (scroll)="onScroll()" tabindex="0" aria-label="Featured anime">
      @if (loading()) {
        @for (item of [].constructor(6); track $index) {
          <div class="carousel-card skeleton-card"></div>
        }
      } @else {
        @for (anime of marqueeList(); track anime.id + '-' + $index) {
          <app-anime-card class="carousel-card" [anime]="anime" />
        }
      }
    </div>
  </div>

  <div class="carousel-footer">
    <div class="dots" aria-label="Carousel navigation">
      @for (i of dotIndices(); track i) {
        <button
          class="dot"
          [class.active]="i === currentSlide()"
          (click)="goToSlide(i)"
          [attr.aria-label]="'Go to collection ' + (i + 1)"
        ></button>
      }
    </div>
    <span class="drag-hint"><span class="drag-line"></span> Drag to explore</span>
  </div>
</div>
