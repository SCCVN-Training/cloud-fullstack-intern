apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: app-service-account
      containers:
        - name: auth
          # Pull the latest image from AWS ECR repository
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-southeast-1.amazonaws.com/otakutory-auth-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: PYTHONPATH
              value: "/app/auth-service"
            - name: PORT
              value: "8001"
            - name: ENVIRONMENT
              value: "production"
            # Add other required environment variables here
            - name: DEBUG
              value: "False"
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=auth-service"
          envFrom:
            - configMapRef:
                name: otel-shared-config
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: default
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8000
  type: ClusterIP
