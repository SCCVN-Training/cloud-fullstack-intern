apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: default
  labels:
    app: profile-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      serviceAccountName: app-service-account
      containers:
        - name: profile
          # Pull the latest image from AWS ECR repository
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-southeast-1.amazonaws.com/otakutory-profile-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: PYTHONPATH
              value: "/app/profile-service"
            - name: PORT
              value: "8002"
            - name: ENVIRONMENT
              value: "production"
            # Add other required environment variables here
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: default
spec:
  selector:
    app: profile-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP
