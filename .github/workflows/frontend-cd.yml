name: Du's Frontend CD

on:
  # workflow_dispatch:
  # workflow_run:
  #   workflows: ["Du's Frontend CI"]
  #   types:
  #     - completed
  #   branches:
  #     - dev-du

  # Temporarily add push event to force GitHub to recognize and run this workflow on the dev branch
  push:
    branches:
      - dev-du
    paths:
      - "frontend-angular/**"
      - ".github/workflows/frontend-cd.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # i f: >
    #   github.event_name == 'workflow_dispatch' ||
    #   (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    name: Du's Frontend CD (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false
        continue-on-error: false

      - name: Build application
        run: npm run build

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.DU_AWS_ACCOUNT_ID }}:role/GitHubActions_FrontendDeployRole
          aws-region: ap-southeast-1

      - name: Deploy to AWS S3
        run: |
          # Sync the compiled Angular files to the S3 bucket
          # Note: Adjust the 'dist/browser' path if your Angular outputs differently
          aws s3 sync dist/frontend-angular/browser s3://${{ secrets.DU_FRONTEND_S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          # Force CloudFront edge locations to clear cache and fetch the latest UI files
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DU_CLOUDFRONT_DIST_ID }} --paths "/*"
