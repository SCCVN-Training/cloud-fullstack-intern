name: Frontend CD

on:
  workflow_run:
    workflows: ["Du's Frontend CI"]
    types:
      - completed
    branches:
      - dev-du

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.DU_AWS_ACCOUNT_ID }}:role/GitHubActions_FrontendDeployRole
          aws-region: ap-southeast-1

      - name: Deploy to AWS S3
        run: |
          # Sync the compiled Angular files to the S3 bucket
          # Note: Adjust the 'dist/browser' path if your Angular outputs differently
          aws s3 sync dist/frontend-angular/browser s3://${{ secrets.DU_FRONTEND_S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          # Force CloudFront edge locations to clear cache and fetch the latest UI files
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DU_CLOUDFRONT_DIST_ID }} --paths "/*"
