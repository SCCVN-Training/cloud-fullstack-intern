name: Continuous Integration

on:
  push:
    branches:
      - dev-du
      - du-feature/**
      - du-fix/**
      - du-chore/**
      - du-docs/**
      - du-refactor/**

  pull_request:
    branches:
      - dev-du

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Latest Active LTS version
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json # Fixed path mismatch

      - name: Install dependencies
        run: npm ci

      # - name: Lint
      #   run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: false

      - name: Build application
        run: npm run build

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-fastapi

    services:
      postgres:
        image: postgres:18 # Upgraded to the newest stable Postgres major version

        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" # Upgraded to the latest stable Python release
          cache: pip
          cache-dependency-path: backend-fastapi/requirements.txt # Optional: Added pip caching

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: pytest
