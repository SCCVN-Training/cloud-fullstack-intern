name: SkillVerse CI

permissions:
  contents: read

on:
  push:
    branches:
      - dev-nhu
      - feature/**
  pull_request:
    branches:
      - dev-nhu

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/skillverse

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/skillverse/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless