name: Du's Backend CD

on:
  # workflow_dispatch:
  # workflow_run:
  #   workflows: ["Du's Backend CI"]
  #   types:
  #     - completed
  #   branches:
  #     - dev-du

  # Temporarily add push event to force GitHub to recognize and run this workflow on the dev branch
  push:
    branches:
      - dev-du
    paths:
      - "microservices/**"
      - ".github/workflows/backend-cd.yml"

# MUST HAVE TO USE OICD ROLE
permissions:
  id-token: write # Permission to ask for JWT Token from Github
  contents: read # Permission to checkout code

jobs:
  deploy:
    # Only deploy when CI is completed and it is a push event
    # i f: >
    #   github.event_name == 'workflow_dispatch' ||
    #   (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    name: Du's Backend CD (Microservices)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis/redis-stack:7.2.0-v0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      ENVIRONMENT: test
      DEBUG: true

      # 2. UPDATE ENVIRONMENT VARIABLES TO NEW STANDARDS
      AUTH_NEON_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testdb
      PROFILE_NEON_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testdb
      MONGODB_CONNECTION_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379

      JWT_SECRET_KEY: test_secret_key_32_chars_long_enough
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CI steps

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff format checking
        run: uvx ruff format --check .

      - name: Run Ruff linting
        run: uvx ruff check .

      - name: Run Tests (Placeholder)
        run: uv run pytest -v || echo "Skipping tests for now"

      # CD steps

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.DU_AWS_ACCOUNT_ID }}:role/GitHubActions_BackendDeployRole
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker images to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Define the list of microservices to iterate over
          SERVICES=("auth" "profile" "anime")

          for SERVICE in "${SERVICES[@]}"; do
            echo "Building image for $SERVICE..."
            IMAGE_NAME="otakutory-${SERVICE}-service"

            # Build the Docker image using the shared Dockerfile in the root microservices folder
            docker build --build-arg SERVICE_NAME=$SERVICE -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG -t $REGISTRY/$IMAGE_NAME:latest .

            echo "Pushing $SERVICE to Amazon ECR..."
            docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
            docker push $REGISTRY/$IMAGE_NAME:latest
          done
