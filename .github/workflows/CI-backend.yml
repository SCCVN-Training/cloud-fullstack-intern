name: Backend CI

on:
  push:
    branches:
      - main
      - "nhu/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for CI
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL || 'sqlite+aiosqlite:///tmp/test.db' }}" > .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY || 'test-secret-key' }}" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
          echo "ADMIN_EMAIL=admin@gmail.com" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD || 'test-password' }}" >> .env
          echo "ADMIN_USERNAME=Admin" >> .env

      - name: Verify FastAPI application
        run: |
          python -c "from app.main import app; print('✅ Backend imported successfully')"