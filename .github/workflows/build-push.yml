name: Build and push service images to ECR

on:
  push:
    branches: ["dev-nhu", "nhu/**"]
    paths:
      - "backend/services/identity-service/**"
      - "backend/services/marketplace-service/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NHU_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.NHU_AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push identity-service
        uses: docker/build-push-action@v6
        with:
          context: backend/services/identity-service
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/skillverse-identity:latest,${{ steps.ecr-login.outputs.registry }}/skillverse-identity:${{ github.sha }}

  build-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NHU_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.NHU_AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push marketplace-service
        uses: docker/build-push-action@v6
        with:
          context: backend/services/marketplace-service
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/skillverse-marketplace:latest,${{ steps.ecr-login.outputs.registry }}/skillverse-marketplace:${{ github.sha }}

  deploy:
    needs: [build-identity, build-marketplace]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Write kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > kubeconfig.yaml
      - run: kubectl --kubeconfig kubeconfig.yaml rollout restart deployment/identity-service deployment/marketplace-service