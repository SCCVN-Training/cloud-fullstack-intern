name: Build and push service images to ECR

on:
  push:
    branches: ["dev-nhu", "nhu/**"]
    paths:
      - "backend/services/identity-service/**"
      - "backend/services/marketplace-service/**"
    workflow_dispatch: {} # lets you trigger a build manually from the Actions tab, useful while testing

permissions:
  id-token: write # required for OIDC — no AWS access key stored anywhere
  contents: read

jobs:
  build-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NHU_GITHUB_ACTIONS_ROLE_ARN }} # from bootstrap/'s output
          aws-region: ${{ vars.NHU_AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push identity-service
        uses: docker/build-push-action@v6
        with:
          context: backend/services/identity-service
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/skillverse-identity:latest,${{ steps.ecr-login.outputs.registry }}/skillverse-identity:${{ github.sha }}

  build-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NHU_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.NHU_AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push marketplace-service
        uses: docker/build-push-action@v6
        with:
          context: backend/services/marketplace-service
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/skillverse-marketplace:latest,${{ steps.ecr-login.outputs.registry }}/skillverse-marketplace:${{ github.sha }}
