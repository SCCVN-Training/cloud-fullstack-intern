name: Du's Backend CI

on:
  # Professional way, but only check this on pull request
  # push:
  #   branches: [dev-du]
  #   paths:
  #     - "microservices/**"
  #     - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [dev-du]
    paths:
      - "microservices/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    name: Du's Backend CI (Microservices)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'" --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis/redis-stack:7.2.0-v0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      ENVIRONMENT: test
      DEBUG: true

      # 2. UPDATE ENVIRONMENT VARIABLES TO NEW STANDARDS
      AUTH_NEON_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testdb
      PROFILE_NEON_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testdb
      MONGODB_CONNECTION_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379

      JWT_SECRET_KEY: test_secret_key_32_chars_long_enough
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff format checking
        run: uvx ruff format --check .

      - name: Run Ruff linting
        run: uvx ruff check .

      - name: Run Tests (Placeholder)
        run: uv run pytest -v || echo "Skipping tests for now"
