name: Syncra Test CI

on: 
  push:
    branches:
      - dev-minh          
      - dev-minh(fe)/**

  pull_request:
    branches:
      - dev-minh

jobs: 
  frontend-tests:
    name: Frontend Tests (Angular)
    runs-on: ubuntu-latest

    defaults: 
      run: 
        working-directory: frontend   # since Angular lives in the frontend folder, this tells the workflow to run shell commands from that folder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4     # by default, the VM is completely empty, this action runs git clone inside the VM so it actually has the repository code. 

      - name: Setup Node.js
        uses: actions/setup-node@v4   # installs Node.js and uses package-lock.json to cache dependencies for faster builds (speed up future CI runs)
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci   # unlike npm install, npm ci strictly follows package-lock.json and is faster for CI/CD pipelines (ensure reproducible builds)

      - name: Run unit tests
        run: npm test -- --watch=false --coverage

      - name: Build application
        run: npm run build