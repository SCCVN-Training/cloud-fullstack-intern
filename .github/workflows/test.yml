  name: Run tests
  on:
    push:
      branches: ['dev-nhu', 'nhu/**']
  jobs:
    backend-tests:
      runs-on: ubuntu-latest
      strategy:
        matrix: { service: [identity-service, marketplace-service] }
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with: { python-version: '3.12' }
        - run: pip install -r backend/services/${{ matrix.service }}/requirements.txt --break-system-packages
        - run: cd backend/services/${{ matrix.service }} && pytest
    frontend-tests:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with: { node-version: '20' }
        - run: cd frontend/skillverse && npm ci && npm test -- --watch=false --browsers=ChromeHeadless