name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    name: Create Draft GitHub Release
    runs-on: ubuntu-latest
    if: github.actor == 'nguyenhaohongduscc' # Only allow the user "nguyenhaohongduscc" to trigger this workflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body: |
            ## 🚀 Overview

            > Replace this section with a summary of this release.

            ---
            ## ✨ New Features

            - [ ] Feature 1
            - [ ] Feature 2
            - [ ] Feature 3

            ---
            ## 🛠 Improvements

            - [ ] Improvement 1
            - [ ] Improvement 2

            ---
            ## 🐛 Bug Fixes

            - [ ] Bug Fix 1
            - [ ] Bug Fix 2

            ---
            ## ⚠ Breaking Changes

            - None

            ---
            ## 📦 Dependencies

            - Update dependencies if applicable.

            ---
            ## 📝 Notes

            - Add any deployment instructions.
            - Add any migration steps.
            - Add known issues.

            ---
            ## 👥 Contributors

            - @nguyenhaohongduscc
