<nav class="header-nav">
  <div class="header-main-row">

    <!-- Logo -->
    <a routerLink="/homepage" class="header-logo">
      <img
        src="/Logo.png"
        class="header-logo-image"
        alt="SkillVerse Logo">
      <span>SkillVerse</span>
    </a>

    <!-- Navigation -->
    <div class="header-links">
      <a
        routerLink="/homepage"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="header-link">
        Home
      </a>

      <a
        routerLink="/browse-skills"
        routerLinkActive="active"
        class="header-link">
        Browse Skills
      </a>

      <a
        routerLink="/how-it-works"
        routerLinkActive="active"
        class="header-link">
        How It Works
      </a>

      <a
        routerLink="/about-us"
        routerLinkActive="active"
        class="header-link">
        About Us
      </a>
    </div>

    <!-- User Actions -->
    <div class="header-actions">

      <ng-container *ngIf="authService.currentUser() as user; else guestActions">

        <div class="user-profile-menu">

          <!-- Profile Trigger -->
          <div class="header-profile-trigger">

            <span class="header-username">
              {{ user.name }}
            </span>

            <ng-container *ngIf="user.avatar; else initialsAvatar">
              <img
                class="header-avatar"
                [src]="user.avatar"
                alt="User avatar">
            </ng-container>

            <ng-template #initialsAvatar>
              <span class="header-avatar header-avatar-initials">
                {{ user.name.charAt(0).toUpperCase() }}
              </span>
            </ng-template>

          </div>

          <!-- Hover Dropdown -->
          <div class="header-dropdown">

            <a
              routerLink="/user/dashboard"
              class="dropdown-item">

              <span class="material-symbols-outlined">
                person
              </span>

              <span>Profile</span>

            </a>

            <div class="dropdown-divider"></div>

            <button
              type="button"
              class="dropdown-item text-error"
              (click)="logout()">

              <span class="material-symbols-outlined">
                logout
              </span>

              <span>Sign Out</span>

            </button>

          </div>

        </div>

      </ng-container>

      <!-- Guest -->
      <ng-template #guestActions>

        <a
          routerLink="/login"
          class="btn-text">
          Login
        </a>

        <a
          routerLink="/register"
          class="btn-primary">
          Register
        </a>

      </ng-template>

    </div>

  </div>
</nav>
