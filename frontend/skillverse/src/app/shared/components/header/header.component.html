<nav class="header-nav">
    <div class="header-main-row">
        <a routerLink="/" class="header-logo">
            <img src="/Logo.png" class="header-logo-image">
            <span>SkillVerse</span>
        </a>

        <!-- Navigation Links -->
        <div class="header-links">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="header-link">Home</a>
            <a routerLink="/browse-skills" routerLinkActive="active" class="header-link">Browse Skills</a>
            <a routerLink="/how-it-works" routerLinkActive="active" class="header-link">How It Works</a>
            <a routerLink="/about-us" routerLinkActive="active" class="header-link">About Us</a>
        </div>
        
        <!-- User Actions -->
        <div class="header-actions">
            <ng-container *ngIf="authService.currentUser() as user; else guestActions">
                <div class="user-profile-menu">
                    <a class="header-profile-trigger">
                        <span class="header-username">
                            {{ user.name }}
                        </span>
                        <ng-container *ngIf="user.avatar; else initialsAvatar">
                            <img
                                class="header-avatar"
                                [src]="user.avatar"
                                alt="User avatar"
                            />
                        </ng-container>
                        <ng-template #initialsAvatar>
                            <span class="header-avatar header-avatar-initials">
                                {{ user.name.charAt(0).toUpperCase() }}
                            </span>
                        </ng-template>
                    </a>
                </div>
            </ng-container>

            <ng-template #guestActions>
                <a routerLink="/login" class="btn-text">Login</a>
                <a routerLink="/register" class="btn-primary">Register</a>
            </ng-template>
        </div>
    </div>
</nav>
