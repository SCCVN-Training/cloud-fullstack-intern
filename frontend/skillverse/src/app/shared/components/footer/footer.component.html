<footer class="footer">
    <div class="footer-container">
        <div class="footer-brand">
            <span class="footer-logo">SkillVerse</span>
            <span class="footer-copyright">© {{ currentYear}} SkillVerse. Exchange wisdom, grow together.</span>
        </div>
        <div class="footer-links">
            <a *ngFor="let link of quickLinks" [routerLink]="link.route" class="footer-link">
                {{ link.label }}
            </a>
        </div>
    </div>
</footer>
