<div class="user-layout">
  <!-- SideNavBar -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <span class="brand-name text-primary">SkillVerse</span>
    </div>

    <div class="user-profile">
      <img
        [src]="authService.currentUser()?.avatar || defaultAvatarUrl"
        alt="User Avatar"
        class="avatar"
      />
      <div class="user-info" *ngIf="authService.currentUser() as user">
        <p class="user-name">{{ user.name }}</p>
        <p class="user-role text-on-surface-variant">Expert Learner</p>
      </div>
    </div>

    <div class="nav-links">
      <a routerLink="/user/dashboard" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined icon-fill">dashboard</span>
        <span class="nav-text">Dashboard</span>
      </a>
      <a routerLink="/user/my-skills" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined">psychology</span>
        <span class="nav-text">My Skills</span>
      </a>
      <a routerLink="/user/my-bookings" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined">event_available</span>
        <span class="nav-text">My Bookings</span>
      </a>
      <a routerLink="/user/wallet" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined">account_balance_wallet</span>
        <span class="nav-text">Wallet</span>
      </a>
      <a routerLink="/user/profile" routerLinkActive="active" class="nav-item">
        <span class="material-symbols-outlined">person</span>
        <span class="nav-text">Profile</span>
      </a>
      <a routerLink="/browse-skills" class="nav-item">
        <span class="material-symbols-outlined">search</span>
        <span class="nav-text">Browse Skills</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="nav-item sign-out" (click)="logout()">
        <span class="material-symbols-outlined">logout</span>
        <span class="nav-text">Sign Out</span>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
