<section class="instructor-panel">
  <div class="instructor-avatar">
    <img [src]="instructor.avatar" [alt]="instructor.name" />
  </div>

  <div class="instructor-info">
    <h3 class="instructor-name">
      {{ instructor.name }}
    </h3>

    <p class="instructor-title">
      {{ instructor.title }}
    </p>

    <p class="instructor-bio">
      {{ instructor.bio }}
    </p>
  </div>
</section>
