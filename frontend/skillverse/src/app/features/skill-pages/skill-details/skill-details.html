<main class="skill-details-container">
  <div *ngIf="isLoading">Loading...</div>

  <div *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div *ngIf="skill">
    <h1>{{ skill.title }}</h1>

    <p>{{ skill.category }}</p>

    <img [src]="skill.image" [alt]="skill.title" width="300" />

    <pre>{{ skill | json }}</pre>
  </div>
</main>
