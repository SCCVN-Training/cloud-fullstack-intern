<main class="skill-details-container">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading skill details...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage" class="error-state">
    <span class="material-symbols-outlined">error_outline</span>
    <p>{{ errorMessage }}</p>
    <button class="btn-retry" (click)="retryLoad()">Try Again</button>
  </div>

  <!-- Success State - Use 'skill' directly -->
  <div *ngIf="!isLoading && !errorMessage && skill">
    <!-- Hero Section -->
    <app-skill-hero [skill]="skill"></app-skill-hero>

    <!-- Main Content Grid -->
    <div class="content-grid">
      <!-- Left Column -->
      <div class="main-column">
        <!-- About Section -->
        <app-skill-about [skill]="skill"></app-skill-about>

        <!-- Instructor Card -->
        <app-instructor-card [skill]="skill"></app-instructor-card>
      </div>

      <!-- Right Column - Sidebar -->
      <div class="sidebar-column">
        <app-booking-card [skill]="skill"></app-booking-card>
      </div>
    </div>

    <!-- Bottom Sections -->
    <div class="bottom-sections">
      <app-review-carousel [skill]="skill"></app-review-carousel>
    </div>
  </div>

  <!-- Fallback if something went wrong -->
  <div *ngIf="!isLoading && !errorMessage && !skill" class="error-state">
    <span class="material-symbols-outlined">info</span>
    <p>No skill data available</p>
  </div>
</main>
