<div class="my-skills-page flex-col min-h-screen">
  <button type="button" class="btn-secondary" routerLink="/homepage">
    Back
  </button>
  <header class="header-sticky flex justify-between items-end pb-sm">
    <div>
      <h1 class="text-headline-lg text-on-surface">My Skills</h1>
      <p class="text-body-md text-on-surface-variant mt-xs">
        Manage the skills you teach and track your impact.
      </p>
    </div>
    <a routerLink="/user/my-skills/create" class="btn-create shadow-md flex items-center gap-sm">
      <span class="material-symbols-outlined">add_circle</span>
      Create New Skill
    </a>
  </header>

  <div class="content-canvas flex-1 flex flex-col gap-lg">
    <div class="mentors-grid">
      <article *ngFor="let skill of skills" class="glass-card skill-card group">
        <div class="decorative-blob" [ngClass]="skill.tone + '-blob'"></div>

        <div class="card-top flex items-center justify-between gap-sm">
          <div
            class="icon-container shadow-sm flex items-center justify-center"
            [ngClass]="skill.tone + '-icon'"
          >
            <span class="material-symbols-outlined">{{ skill.icon }}</span>
          </div>
          <span class="status-badge text-label-sm px-sm py-xs rounded-full">
            {{ skill.status }}
          </span>
        </div>

        <div class="card-body z-10">
          <h3 class="text-title-lg text-on-surface mb-xs">{{ skill.title }}</h3>
          <p class="text-body-md text-on-surface-variant line-clamp-2">
            {{ skill.description }}
          </p>
        </div>

        <div class="stat-grid mt-auto z-10 gap-sm">
          <div class="stat-box p-sm flex flex-col gap-xs">
            <span class="material-symbols-outlined text-tertiary">group</span>
            <div>
              <span class="text-label-md text-on-surface block">{{ skill.students }}</span>
              <span class="text-label-sm text-on-surface-variant">Students</span>
            </div>
          </div>
          <div class="stat-box p-sm flex flex-col gap-xs">
            <span class="material-symbols-outlined text-secondary">toll</span>
            <div>
              <span class="text-label-md text-on-surface block">{{ skill.coins | number }}</span>
              <span class="text-label-sm text-on-surface-variant">Coins Earned</span>
            </div>
          </div>
        </div>

        <div class="actions flex gap-sm mt-md z-10">
          <button
            type="button"
            class="btn-edit text-on-surface text-label-md py-sm flex-1 flex justify-center items-center gap-xs rounded-lg"
          >
            <span class="material-symbols-outlined" style="font-size: 18px">edit</span>
            Edit
          </button>
          <button type="button" class="btn-delete text-error p-sm flex-none rounded-lg">
            <span class="material-symbols-outlined" style="font-size: 20px">delete</span>
          </button>
        </div>
      </article>
    </div>
  </div>
</div>
