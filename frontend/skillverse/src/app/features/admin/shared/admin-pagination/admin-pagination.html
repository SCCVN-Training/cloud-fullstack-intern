<footer class="admin-pagination">
  <span class="admin-pagination-info">
    Showing
    {{ showingFrom }}
    to
    {{ showingTo }}
    of
    {{ totalItems }}
    entries
  </span>

  <div class="admin-page-controls">
    <button
      type="button"
      class="admin-pagination-button"
      [disabled]="currentPage === 1"
      (click)="previousPage()"
    >
      Previous
    </button>

    <button
      *ngFor="let page of pages"
      type="button"
      class="admin-page-number"
      [class.active]="currentPage === page"
      (click)="goToPage(page)"
    >
      {{ page }}
    </button>

    <span *ngIf="totalPages > 3" class="admin-page-ellipsis"> ... </span>

    <button
      *ngIf="totalPages > 3"
      type="button"
      class="admin-page-number"
      [class.active]="currentPage === totalPages"
      (click)="goToPage(totalPages)"
    >
      {{ totalPages }}
    </button>

    <button
      type="button"
      class="admin-pagination-button"
      [disabled]="currentPage === totalPages"
      (click)="nextPage()"
    >
      Next
    </button>
  </div>
</footer>
