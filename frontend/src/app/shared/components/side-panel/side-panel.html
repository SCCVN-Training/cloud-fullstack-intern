<aside class="side-panel">
  <div class="storage-summary">
    <h2>Cloud Storage</h2>
    <p class="storage-text">
      <span class="bold">{{ usedStorage }} GB</span> of {{ totalStorage }} GB
      used
    </p>
    <mat-progress-bar
      mode="determinate"
      [value]="storagePercentage()"
    ></mat-progress-bar>
  </div>

  <nav class="nav-links">
    <button
      *ngFor="let item of navItems"
      [class.active]="activeNav === item.key"
      (click)="navChange.emit(item.key)"
      class="nav-item"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </button>
  </nav>

  <div class="sidebar-action">
    <button
      mat-stroked-button
      color="primary"
      class="upgrade-btn"
      (click)="upgrade.emit()"
    >
      Upgrade Storage
    </button>
  </div>
</aside>
