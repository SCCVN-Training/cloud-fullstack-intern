<header class="navbar-shell">

    <a href="#" class="logo-link" aria-label="Home">
      <img 
        src="../../../assets/SCC_logo_NEW.png" 
        alt="SCC Event Portal Logo" 
        class="brand-logo" 
      />
    </a>
  </div>

  <div class="search-bar">
    <span class="material-symbols-outlined search-icon">search</span>
    <input type="text" placeholder="Search events, workshops..." />

  <div class="navbar-actions">
    <button class="icon-btn" aria-label="Notifications">
      <span class="material-symbols-outlined">notifications</span>

    <button class="icon-btn action-hide-mobile" aria-label="Settings">
      <span class="material-symbols-outlined">settings</span>
    </button>

    <div class="profile-avatar">
      <button class="icon-btn" aria-label="Your Profile">
        <span class="material-symbols-outlined">person</span>
