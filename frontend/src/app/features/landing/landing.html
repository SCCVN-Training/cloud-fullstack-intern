<div class="nephos-landing-wrapper">
  <!-- Minimal Navbar/Header -->
  <header class="landing-header mat-elevation-z1">
    <div class="container header-content">
      <div class="logo-area">
        <mat-icon color="primary" class="logo-icon">cloud_queue</mat-icon>
        <span class="brand-name">Nephos</span>
      </div>
      <div class="nav-actions">
        <a routerLink="/login" mat-stroked-button color="white">Sign in</a>
        <a routerLink="/register" mat-flat-button color="white"
          >Create account</a
        >
      </div>
    </div>
  </header>

  <!-- landing / Introduction Section -->
  <main class="landing-section container">
    <div class="landing-content">
      <h1>Cloud Storage, as light as air.</h1>
      <p class="landing-subtitle">
        Simple, secure, and beautiful file management. Access your files from
        anywhere, any time, with Nephos.
      </p>
      <div class="landing-actions">
        <a
          routerLink="/register"
          mat-flat-button
          color="white"
          class="cta-button"
        >
          Start for Free
        </a>
      </div>
    </div>
  </main>
</div>
