<div class="events-page">
  <div class="events-body">
    <app-event-filters (filtersChanged)="onFiltersChanged($event)"></app-event-filters>

    <main class="events-content">
      <div class="events-content-header">
        <span class="results-count">Showing <strong>{{ totalItems }}</strong> workshops</span>
        <div class="sort-control">
          <span>Sort by:</span>
          <select>
            <option>Earliest Date</option>
            <option>Newest</option>
            <option>Most Popular</option>
          </select>
        </div>
      </div>

      <div class="events-grid" *ngIf="!isLoading; else loadingState">
        <app-event-card *ngFor="let workshop of workshops" [workshop]="workshop"></app-event-card>
      </div>
      <ng-template #loadingState>
        <p class="loading-text">Loading workshops…</p>
      </ng-template>

      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChanged)="onPageChanged($event)"
      ></app-pagination>
    </main>
  </div>
</div>
