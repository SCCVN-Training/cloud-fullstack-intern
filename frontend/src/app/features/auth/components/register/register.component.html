<div class="minimal-auth-container">
  <div class="auth-back">
    <button mat-icon-button routerLink="/">
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>
  <mat-card class="minimal-auth-box">
    <header class="auth-header">
      <h1>
        <a class="logo-area">
          <mat-icon class="logo-icon">cloud_queue</mat-icon>
          <span class="brand-name">Nephos</span>
        </a>
      </h1>
      <p>Create your new account</p>
    </header>

    @if (errorMessage()) {
      <div class="alert-banner">{{ errorMessage() }}</div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Full Name</mat-label>
        <input
          matInput
          type="text"
          formControlName="username"
          placeholder="John Doe"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Email address</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="name@example.com"
          autocomplete="email"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
      </mat-form-field>

      <div class="auth-actions">
        <a routerLink="/login" class="text-link">Sign in instead</a>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="isLoading() || registerForm.invalid"
        >
          @if (isLoading()) {
            Creating account...
          } @else {
            Register
          }
        </button>
      </div>
    </form>
  </mat-card>
</div>
