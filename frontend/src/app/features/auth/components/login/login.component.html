<div class="minimal-auth-container">
  <div class="auth-back">
    <button mat-icon-button routerLink="/">
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>
  <mat-card class="minimal-auth-box">
    <mat-card-header class="auth-header">
      <mat-card-title>
        <a class="logo-area">
          <mat-icon class="logo-icon">cloud_queue</mat-icon>
          <span class="brand-name">Nephos</span>
        </a>
      </mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (errorMessage()) {
        <div class="alert-banner">{{ errorMessage() }}</div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Email address</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="email"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        <div class="auth-actions">
          <a routerLink="/register" class="text-link">Create an account</a>

          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="isLoading() || loginForm.invalid"
          >
            @if (isLoading()) {
              Sign in...
            } @else {
              Sign in
            }
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
