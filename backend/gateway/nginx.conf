events {}

http {
    server {
        listen 8080;

        # /identity/* -> identity-service:8001
        location /identity/ {
            proxy_pass http://identity-service:8001/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # $request_id is an nginx built-in — a fresh UUID per
            # inbound request. It becomes the correlation ID both
            # services log against.
            proxy_set_header X-Request-ID $request_id;

            # CORS — centralized here instead of per-service. Both
            # services' CORSMiddleware has been removed accordingly.
            add_header Access-Control-Allow-Origin "http://localhost:4200" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
        }

        # /marketplace/* -> marketplace-service:8002
        # Also carries the video-call signaling WebSocket
        # (/marketplace/ws/bookings/{id}/signal), so this location
        # needs the Upgrade/Connection headers on top of everything
        # /identity/ has.
        location /marketplace/ {
            proxy_pass http://marketplace-service:8002/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Request-ID $request_id;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            # WebSocket connections (the signaling channel) are
            # long-lived; nginx's default proxy_read_timeout (60s) would
            # silently kill an idle-but-open call. Extend it well past a
            # typical session length.
            proxy_read_timeout 3600s;

            add_header Access-Control-Allow-Origin "http://localhost:4200" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
        }
    }
}
