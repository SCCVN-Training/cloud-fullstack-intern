apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-identity
spec:
  stripPrefix:
    prefixes:
      - /api/identity
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-marketplace
spec:
  stripPrefix:
    prefixes:
      - /api/marketplace
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-identity@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/identity
            pathType: Prefix
            backend:
              service: { name: identity-service, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketplace-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-marketplace@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /api/marketplace
            pathType: Prefix
            backend:
              service: { name: marketplace-service, port: { number: 80 } }
