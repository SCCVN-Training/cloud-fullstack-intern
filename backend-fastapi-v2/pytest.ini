[pytest]
minversion = 7.0
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=2
    --disable-warnings
    --cov=modules.auth
    --cov=shared
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

# ============ ADD THIS SECTION ============
markers =
    unit: Unit tests (fast, no external dependencies, uses mocks)
    integration_fast: Fast integration tests (uses in-memory SQLite, mongomock, fakeredis)
    integration_real: Real integration tests (uses real PostgreSQL, MongoDB, Redis) - CI only
    integration: All integration tests (fast + real)
    asyncio: Marks async tests
# ==========================================

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
