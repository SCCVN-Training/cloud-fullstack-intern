# .github/workflows/deploy.yml
name: Du's Deployment Pipeline

on:
  workflow_run:
    workflows: ["Du's Continuous Integration Pipeline"]
    types:
      - completed
    branches:
      - dev-du # 👈 Strict isolation by branch

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # environment: dev-du # ❌ Removed because of repo restrictions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 👇 Using the prefixed secrets directly from Repository Secrets
          aws-access-key-id: ${{ secrets.DU_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DU_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Terraform Init & Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve
